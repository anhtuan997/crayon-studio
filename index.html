<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Crayon Studio OS v7.0 — iPhone Remote Portal</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #090B10; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center; padding: 24px;
    }
    .card {
      background: #121621; border: 1px solid #1E2638; border-radius: 18px; padding: 28px; max-width: 420px; width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    input {
      width: 160px; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #090B10;
      color: #FFE600; font-size: 22px; font-weight: 900; text-align: center; letter-spacing: 6px; margin-top: 10px;
    }
    .btn {
      display: inline-block; margin-top: 16px; padding: 13px 24px; border-radius: 12px; border: none; cursor: pointer;
      background: #FFE600; color: #090B10; font-weight: 900; font-size: 15px; text-decoration: none; width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:40px;">🎬📱</div>
    <h2 style="margin:10px 0 6px;">Crayon Studio OS v7.0</h2>
    <p style="color:#94A3B8;font-size:13px;">Cổng Kết Nối Cố Định GitHub Pages &rarr; Máy Mac Studio</p>
    <div style="margin:14px 0;padding:10px;background:#090B10;border-radius:10px;font-size:12px;color:#38BDF8;word-break:break-all;">
      Tunnel hiện tại: <b id="tunnelDisplay">https://singer-mortality-red-standards.trycloudflare.com</b>
    </div>
    <div>
      <div style="font-size:12px;color:#94A3B8;">Nhập mã PIN bảo mật (mặc định 2026 — tự nhớ trên iPhone):</div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" value="2026" />
    </div>
    <button class="btn" id="connectBtn" onclick="connectNow()">🚀 Mở Xưởng Phim Trên iPhone</button>
  </div>
  <script>
    let TUNNEL_BASE = "https://singer-mortality-red-standards.trycloudflare.com";
    const savedPin = localStorage.getItem('crayon_studio_pin') || '2026';
    document.getElementById('pinInput').value = savedPin;

    async function refreshLatestTunnelFromGithubApi() {
      try {
        const res = await fetch('https://api.github.com/repos/anhtuan997/crayon-studio/contents/tunnel.json?t=' + Date.now(), {
          cache: 'no-store'
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            const decoded = JSON.parse(atob(data.content.replace(/\s/g, '')));
            if (decoded && decoded.tunnel_url) {
              TUNNEL_BASE = decoded.tunnel_url;
              document.getElementById('tunnelDisplay').textContent = TUNNEL_BASE;
            }
          }
        }
      } catch (e) {}
    }

    async function connectNow() {
      const btn = document.getElementById('connectBtn');
      if (btn) btn.textContent = '⏳ Đang kết nối thẳng vào Máy Mac...';
      await refreshLatestTunnelFromGithubApi();
      const p = (document.getElementById('pinInput').value || '2026').trim();
      localStorage.setItem('crayon_studio_pin', p);
      window.location.href = TUNNEL_BASE + '/?pin=' + encodeURIComponent(p);
    }

    refreshLatestTunnelFromGithubApi().then(() => {
      if (localStorage.getItem('crayon_studio_pin')) {
        setTimeout(connectNow, 350);
      }
    });
  </script>
</body>
</html>
